name: Discovery + evidence scan

on:
  workflow_dispatch:
  push:
    paths:
      - "scanner/scan.py"
      - "scanner/evidence.py"
      - "scanner/requirements.txt"
      - ".github/workflows/discovery-scan.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: discovery-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scanner/requirements.txt

      - name: Install scanner dependencies
        run: pip install -r scanner/requirements.txt

      - name: Discover current sources
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scanner/scan.py

      - name: Build evidence packets from this scan
        env:
          FACTCHECK_API_KEY: ${{ secrets.FACTCHECK_API_KEY }}
        run: python scanner/evidence.py

      - name: Commit discovery and evidence feeds if changed
        shell: bash
        run: |
          if git diff --quiet -- data/discovery/latest.json data/evidence/latest.json; then
            echo "No intelligence-feed change."
            exit 0
          fi
          git config user.name "claimwatch-bot"
          git config user.email "claimwatch-bot@users.noreply.github.com"
          git add data/discovery/latest.json data/evidence/latest.json
          git commit -m "data: refresh discovery and evidence"
          git pull --rebase origin main
          git push
