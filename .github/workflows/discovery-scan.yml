name: Discovery scan

on:
  workflow_dispatch:
  push:
    paths:
      - "scanner/**"
      - ".github/workflows/discovery-scan.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: discovery-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scanner/requirements.txt

      - name: Install scanner dependencies
        run: pip install -r scanner/requirements.txt

      - name: Scan current sources
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scanner/scan.py

      - name: Commit discovery feed if changed
        shell: bash
        run: |
          if git diff --quiet -- data/discovery/latest.json; then
            echo "No discovery-feed change."
            exit 0
          fi
          git config user.name "claimwatch-bot"
          git config user.email "claimwatch-bot@users.noreply.github.com"
          git add data/discovery/latest.json
          git commit -m "data: refresh discovery feed"
          git push
