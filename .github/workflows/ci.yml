name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python test dependencies
        run: pip install -r scanner/requirements.txt

      - name: Install scanner dependencies
        run: pip install -r scanner/requirements.txt

      - name: Python syntax
        run: python -m py_compile scanner/scan.py scanner/manifestos.py scanner/evidence.py scanner/test_core.py

      - name: Core regression tests
        run: python scanner/test_core.py

      - name: Manifesto extraction semantics
        run: |
          python - <<'PY'
          import scanner.manifestos as m
          assert m.YEAR_TOKEN_RE.fullmatch("2024")
          assert m.extract_years("Started in 2014 and targeted by 2030.") == ["2014", "2030"]
          assert "2024" not in m.extract_numbers("The programme began in 2024.")
          assert m.extract_deadlines("We will complete it by 2030.") == ["by 2030"]
          assert m.extract_deadlines("The programme began in 2019.") == []
          print("Manifesto semantic checks passed")
          PY

      - name: JavaScript syntax
        run: node --check site/app.js && node --check site/transcribe.js && node --check functions/api/check.js

      - name: Dashboard startup selector guard
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("site/app.js").read_text(encoding="utf-8")
          bad_single = re.findall(r'(?<!\\$)\\$\\("[^"]+"\\)\\.forEach', text)
          bad_many = re.findall(r'\\${3,}\\("[^"]+"\\)\\.forEach', text)
          assert not bad_single, "querySelector used with forEach: " + repr(bad_single)
          assert not bad_many, "invalid selector helper prefix: " + repr(bad_many)
          print("Dashboard selector smoke check passed")
          PY

      - name: Validate JSON feeds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [
              Path("corpus/manifesto_sources.json"),
              Path("data/discovery/latest.json"),
              Path("data/promises/candidates.json"),
              Path("data/evidence/latest.json"),
          ]:
              json.loads(p.read_text(encoding="utf-8"))
              print("OK", p)
          PY
