name: Evidence scan

on:
  workflow_dispatch:
  push:
    paths:
      - "scanner/evidence.py"
      - "data/discovery/latest.json"
      - "data/promises/candidates.json"
      - ".github/workflows/evidence-scan.yml"
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: evidence-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scanner/requirements.txt

      - name: Install dependencies
        run: pip install -r scanner/requirements.txt

      - name: Rebase to latest main before generating
        run: git pull --rebase origin main

      - name: Build evidence packets
        env:
          FACTCHECK_API_KEY: ${{ secrets.FACTCHECK_API_KEY }}
        run: python scanner/evidence.py

      - name: Commit evidence feed if changed
        shell: bash
        run: |
          if git diff --quiet -- data/evidence/latest.json; then
            echo "No evidence-feed change."
            exit 0
          fi
          git config user.name "claimwatch-bot"
          git config user.email "claimwatch-bot@users.noreply.github.com"
          git add data/evidence/latest.json
          git commit -m "data: refresh evidence intelligence"
          git push
