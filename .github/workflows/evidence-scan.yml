name: Evidence scan

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Discovery scan"
      - "Manifesto corpus"
    types:
      - completed
  push:
    paths:
      - "scanner/evidence.py"
      - ".github/workflows/evidence-scan.yml"
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: evidence-scan
  cancel-in-progress: true

jobs:
  scan:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_NLI: "1"
      NLI_MODEL: MoritzLaurer/multilingual-MiniLMv2-L6-mnli-xnli
      HF_HOME: ~/.cache/huggingface

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scanner/requirements.txt

      - name: Cache evidence model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: claimwatch-nli-multilingual-minilm-v1

      - name: Install dependencies
        run: |
          pip install -r scanner/requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers==4.56.2

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Build evidence packets
        env:
          FACTCHECK_API_KEY: ${{ secrets.FACTCHECK_API_KEY }}
        run: python scanner/evidence.py

      - name: Commit evidence feed if changed
        shell: bash
        run: |
          if git diff --quiet -- data/evidence/latest.json; then
            echo "No evidence-feed change."
            exit 0
          fi
          git config user.name "claimwatch-bot"
          git config user.email "claimwatch-bot@users.noreply.github.com"
          git add data/evidence/latest.json
          git commit -m "data: refresh evidence intelligence"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed because main advanced; rebasing generated data."
            git pull --rebase -X theirs origin main
          done
          echo "Unable to push generated data after 3 attempts."
          exit 1
