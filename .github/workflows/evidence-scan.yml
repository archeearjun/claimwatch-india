name: Evidence scan

on:
  workflow_dispatch:
  push:
    paths:
      - "scanner/evidence.py"
      - ".github/workflows/evidence-scan.yml"
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: evidence-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scanner/requirements.txt

      - name: Install dependencies
        run: pip install -r scanner/requirements.txt

      - name: Refresh manifesto corpus when empty
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/promises/candidates.json")
          data = json.loads(p.read_text()) if p.exists() else {}
          raise SystemExit(0 if data.get("promises") else 10)
          PY
        continue-on-error: true
        id: corpus_check

      - name: Build manifesto corpus if needed
        if: steps.corpus_check.outcome == 'failure'
        run: python scanner/manifestos.py

      - name: Build evidence packets
        env:
          FACTCHECK_API_KEY: ${{ secrets.FACTCHECK_API_KEY }}
        run: python scanner/evidence.py

      - name: Commit generated intelligence if changed
        shell: bash
        run: |
          if git diff --quiet -- data/promises/candidates.json data/evidence/latest.json; then
            echo "No evidence-feed change."
            exit 0
          fi
          git config user.name "claimwatch-bot"
          git config user.email "claimwatch-bot@users.noreply.github.com"
          git add data/promises/candidates.json data/evidence/latest.json
          git commit -m "data: refresh evidence intelligence"
          git pull --rebase origin main
          git push
