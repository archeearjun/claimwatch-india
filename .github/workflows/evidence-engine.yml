name: Evidence engine

on:
  workflow_dispatch:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/evidence-engine.yml"
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: evidence-engine
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENABLE_NLI: "1"
      NLI_MODEL: cross-encoder/nli-MiniLM2-L6-H768
      HF_HOME: ~/.cache/huggingface

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: engine/requirements.txt

      - name: Cache NLI model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: claimwatch-nli-minilm2-v1

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r engine/requirements.txt

      - name: Run evidence engine
        run: python engine/evidence.py

      - name: Commit evidence feed if changed
        shell: bash
        run: |
          if git diff --quiet -- data/evidence/latest.json; then
            echo "No evidence-feed change."
            exit 0
          fi
          git config user.name "claimwatch-bot"
          git config user.email "claimwatch-bot@users.noreply.github.com"
          git add data/evidence/latest.json
          git commit -m "data: refresh evidence assessments"
          git push
