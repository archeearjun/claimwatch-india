name: Build promise corpus

on:
  workflow_dispatch:
  push:
    paths:
      - "promises/**"
      - ".github/workflows/promise-corpus.yml"
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: write

concurrency:
  group: promise-corpus
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: promises/requirements.txt

      - name: Install dependencies
        run: pip install -r promises/requirements.txt

      - name: Build manifesto promise corpus
        run: python promises/build_corpus.py

      - name: Commit corpus if changed
        shell: bash
        run: |
          if git diff --quiet -- data/promises/corpus.json; then
            echo "No corpus change."
            exit 0
          fi
          git config user.name "claimwatch-bot"
          git config user.email "claimwatch-bot@users.noreply.github.com"
          git add data/promises/corpus.json
          git commit -m "data: rebuild manifesto promise corpus"
          git push
